name: Build and Deploy Plugins

on:

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all plugins
        run: |
          set -e

          for plugin in */; do
            if [ -f "${plugin}pom.xml" ]; then
              echo "========================================"
              echo "Building plugin: ${plugin}"
              echo "========================================"

              mvn --batch-mode \
                -f "${plugin}pom.xml" \
                clean package \
                -Dmaven.test.skip=true
            fi
          done

      - name: Collect plugin JARs
        run: |
          set -e

          mkdir -p deploy

          for plugin in */; do
            if [ -d "${plugin}target" ]; then

              JAR=$(find "${plugin}target" \
                -maxdepth 1 \
                -type f \
                -name "*.jar" \
                ! -name "*-original.jar" \
                ! -name "*-sources.jar" \
                ! -name "*-javadoc.jar" \
                | head -n 1)

              if [ -n "$JAR" ]; then
                echo "Found plugin JAR: $JAR"

                cp "$JAR" deploy/

              else
                echo "No JAR found for ${plugin}"
              fi
            fi
          done

          echo ""
          echo "Plugins to deploy:"
          ls -lh deploy/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      - name: Create remote directory
        run: |
          ssh \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p '${{ secrets.PLUGIN_TARGET_DIR }}'"

      - name: Upload all plugins
        run: |
          scp \
            -P "${{ secrets.SERVER_PORT }}" \
            deploy/*.jar \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.PLUGIN_TARGET_DIR }}/"

      - name: Verify deployment
        run: |
          ssh \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "ls -lh '${{ secrets.PLUGIN_TARGET_DIR }}'"

