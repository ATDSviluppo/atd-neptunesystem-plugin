name: Build and Deploy Plugin

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================================
      # Setup Java
      # ==========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # ==========================================================
      # Build plugin
      # ==========================================================
      - name: Build plugin
        working-directory: MailModule
        run: |
          mvn --batch-mode clean package -Dmaven.test.skip=true


      # ==========================================================
      # Prepare JAR
      # ==========================================================
      - name: Prepare plugin
        run: |
          mkdir -p deploy

          JAR=$(find MailModule/target -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: Plugin JAR not found"
            exit 1
          fi

          echo "Plugin JAR: $JAR"

          cp "$JAR" deploy/plugin.jar

          ls -lh deploy/plugin.jar


      # ==========================================================
      # Configure SSH
      # ==========================================================
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts


      # ==========================================================
      # Deploy plugin
      # ==========================================================
      - name: Upload plugin
        run: |
          ssh \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "mkdir -p '${{ secrets.PLUGIN_TARGET_DIR }}'"

          scp \
            -P "${{ secrets.SERVER_PORT }}" \
            deploy/plugin.jar \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.PLUGIN_TARGET_DIR }}/plugin.jar"


      # ==========================================================
      # Verify deployment
      # ==========================================================
      - name: Verify deployment
        run: |
          ssh \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "ls -lh '${{ secrets.PLUGIN_TARGET_DIR }}/plugin.jar'"
